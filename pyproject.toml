[project]
name = "kindlife_app"
authors = [
    { name = "Auriga IT", email = "praveen.kumawat@aurigait.com"}
]
description = "Kindlife ERP Customisations"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
